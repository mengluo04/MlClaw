name: 检查与容器验收
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: node scripts/check-public-files.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:production:browser
      - name: 校验 Compose 配置
        env:
          APP_ORIGIN: https://assistant.example.com
          MLCLAW_DOMAIN: assistant.example.com
        run: docker compose -f compose.yaml -f compose.https.yaml config --quiet
      - name: 构建并验收容器
        run: |
          docker build -t mlclaw:ci .
          MLCLAW_TEST_IMAGE=mlclaw:ci npm run test:container
