services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      MLCLAW_DOMAIN: ${MLCLAW_DOMAIN:?请设置已解析到服务器的域名}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      mlclaw:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  caddy_data:
  caddy_config:
